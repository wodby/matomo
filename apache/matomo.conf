# Matomo writes .htaccess files into its code directories. These rules cover
# the Marketplace plugins in the files directory, where those files aren't.
<LocationMatch "^/marketplace-plugins/.*\.(php|phtml|phar|ini|json|twig|log)$">
    Require all denied
</LocationMatch>
<LocationMatch "^/marketplace-plugins/.*/manifest\.json$">
    Require all granted
</LocationMatch>
